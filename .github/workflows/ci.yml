name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: astral-sh/setup-uv@v6  # provides uvx, used by scripts/check.sh to run ty

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run checks (same script as locally)
        run: PYTHON=python scripts/check.sh
